<script src="/vendor/react.production.min.js"></script>

<style>
:root {
  --bg:#0a0e16; --bg2:#0e131c; --bg3:#161c28; --bd:#1f2937;
  --tx:#e6edf3; --t2:#a3adba; --t3:#6b7280;
  --am:#4cc3ff; --gn:#10b981; --yw:#f59e0b; --rd:#ef4444; --bl:#3b82f6;
  --r:8px; --r-sm:6px;
  --code-bg:#1a1a1a; --code-tx:#e2e8f0;
}
[data-theme="light"] {
  --bg:#f1f5f9; --bg2:#ffffff; --bg3:#e8edf5; --bd:#d1d9e6;
  --tx:#0f172a; --t2:#475569; --t3:#94a3b8;
  --am:#0284c7; --gn:#059669; --yw:#d97706; --rd:#dc2626; --bl:#2563eb;
  --code-bg:#e8edf5; --code-tx:#1e293b;
}
html { background:var(--bg); height:100%; overflow:hidden; }
* { box-sizing:border-box; }
body { margin:0; padding:0; background:var(--bg); color:var(--tx); font-family:'Inter',system-ui,sans-serif; font-size:14px; height:100%; overflow:hidden; }
#root { height:100%; }
button { font-family:inherit; cursor:pointer; }
input, select, textarea { font-family:inherit; }
a { color:var(--am); text-decoration:none; }
.app { display:grid; grid-template-columns:240px 1fr; height:100vh; overflow:hidden; }
.sidebar { background:var(--bg2); border-right:1px solid var(--bd); padding:0; display:flex; flex-direction:column; height:100vh; overflow-y:auto; }
.sidebar-brand { display:flex; align-items:center; gap:10px; padding:16px 14px 14px; border-bottom:1px solid var(--bd); flex-shrink:0; }
.mg-badge { width:36px; height:36px; border-radius:8px; background:linear-gradient(135deg,#4CTS3FF 0%,#3b82f6 100%); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff; letter-spacing:0.5px; flex-shrink:0; box-shadow:0 2px 8px rgba(79,195,255,0.3); }
[data-theme="light"] .mg-badge { background:linear-gradient(135deg,#0284c7 0%,#1d4ed8 100%); box-shadow:0 2px 8px rgba(2,132,199,0.3); }
.sidebar-brand h1 { font-size:15px; font-weight:700; color:var(--tx); margin:0; line-height:1.2; }
.sidebar-brand .ver { font-size:10px; color:var(--t3); margin-top:1px; }
.sidebar-nav { flex:1; padding:8px 0; overflow-y:auto; }
.sidebar-bottom { padding:6px 0 8px; flex-shrink:0; border-top:1px solid var(--bd); }
.sidebar-sep { height:1px; background:var(--bd); margin:2px 14px 6px; }
.nav-section { padding:10px 14px 2px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--t3); margin-top:4px; }
.sidebar-user { padding:10px 14px 8px; border-bottom:1px solid var(--bd); }
.sidebar-user-lbl { font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; }
.sidebar-user-name { font-size:13px; font-weight:600; color:var(--tx); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; color:var(--t2); cursor:pointer; border-left:3px solid transparent; font-size:13px; font-weight:500; transition:background 0.12s,color 0.12s; }
.nav-item:hover { background:var(--bg3); color:var(--tx); }
.nav-item.active { background:var(--bg3); color:var(--am); border-left-color:var(--am); }
.nav-item svg { flex-shrink:0; opacity:0.75; }
.nav-item:hover svg, .nav-item.active svg { opacity:1; }
.nav-logout { color:var(--rd) !important; }
.nav-logout:hover { background:rgba(220,38,38,0.08) !important; color:var(--rd) !important; }
.main { display:flex; flex-direction:column; height:100vh; overflow:hidden; padding:0; }
.main-content { flex:1; min-height:0; overflow-y:auto; padding:20px 28px 28px; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:20px 28px 14px; border-bottom:1px solid var(--bd); flex-shrink:0; }
.topbar h2 { margin:0; font-size:20px; font-weight:600; }
.topbar .user { font-size:12px; color:var(--t2); }
.topbar .user b { color:var(--tx); }
.btn { background:var(--am); color:#000; border:none; border-radius:var(--r-sm); padding:8px 14px; font-weight:600; font-size:12px; }
.btn:hover { opacity:0.9; }
.btn.secondary { background:var(--bg3); color:var(--tx); border:1px solid var(--bd); }
.btn:disabled { opacity:0.5; cursor:default; }
.card { background:var(--bg2); border:1px solid var(--bd); border-radius:var(--r); padding:18px; }
.grid { display:grid; gap:14px; }
.grid-cols-4 { grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); }
.stat { padding:14px; }
.stat .lbl { font-size:11px; color:var(--t3); text-transform:uppercase; letter-spacing:0.05em; }
.stat .val { font-size:28px; font-weight:700; margin-top:4px; }
.stat.gn .val { color:var(--gn); }
.stat.yw .val { color:var(--yw); }
.stat.rd .val { color:var(--rd); }
.stat.bl .val { color:var(--bl); }
table { width:100%; border-collapse:collapse; }
th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--bd); font-size:13px; }
th { background:var(--bg3); color:var(--t2); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; position:sticky; top:0; z-index:1; }
.table-wrap { overflow-x:auto; overflow-y:auto; max-height:calc(100vh - 230px); }
.badge { display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:500; border:1px solid transparent; line-height:1.35; }
.b-clean { background:rgba(16,185,129,0.13); color:var(--gn); border-color:rgba(16,185,129,0.30); }
.b-quarantined { background:rgba(245,158,11,0.13); color:var(--yw); border-color:rgba(245,158,11,0.32); }
.b-strict { background:rgba(239,68,68,0.13); color:var(--rd); border-color:rgba(239,68,68,0.30); }
.b-quarantined-strict { background:rgba(239,68,68,0.13); color:var(--rd); border-color:rgba(239,68,68,0.30); }
.b-ndr { background:rgba(107,114,128,0.13); color:var(--t2); border-color:rgba(107,114,128,0.30); }
.b-duplicate { background:rgba(107,114,128,0.10); color:var(--t2); border-color:rgba(107,114,128,0.25); }
.b-pending { background:rgba(59,130,246,0.13); color:var(--bl); border-color:rgba(59,130,246,0.30); }
.login-box { max-width:380px; margin:80px auto; padding:32px; }
.login-box h1 { margin:0 0 8px; color:var(--am); font-size:28px; text-align:center; }
.login-box .sub { text-align:center; color:var(--t2); margin-bottom:28px; font-size:13px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:11px; color:var(--t2); margin-bottom:4px; text-transform:uppercase; }
.field input { width:100%; background:var(--bg3); border:1px solid var(--bd); border-radius:var(--r-sm); padding:10px 12px; color:var(--tx); font-size:14px; }
.field input:focus { outline:none; border-color:var(--am); }
.err { color:var(--rd); font-size:12px; margin-top:6px; }
.ok { color:var(--gn); font-size:12px; margin-top:6px; }

/* Modal email detail */
.mg-emailrow { transition:background .12s ease, border-color .12s ease; }
.mg-emailrow:hover { background:var(--bg3); border-color:var(--t3); }
.mg-detailpane { background:var(--bg2); border:1px solid var(--bd); border-radius:var(--r); overflow:hidden; }
.mg-railitem { transition:background .1s ease, border-color .1s ease; }
.mg-railitem:hover { background:var(--bg3); }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px; }
.modal { background:var(--bg2); border:1px solid var(--bd); border-radius:var(--r); width:1320px; max-width:96vw; height:88vh; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,0.5); }
.modal-head { display:flex; justify-content:space-between; align-items:flex-start; padding:16px 20px; border-bottom:1px solid var(--bd); gap:14px; }
.modal-head h3 { margin:0 0 6px; font-size:16px; line-height:1.35; }
.modal-meta { font-size:12px; color:var(--t2); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.modal-close { background:transparent; border:1px solid var(--bd); color:var(--t2); width:32px; height:32px; border-radius:6px; font-size:16px; line-height:1; padding:0; flex-shrink:0; }
.modal-close:hover { color:var(--rd); border-color:var(--rd); }
.modal-tabs { display:flex; gap:0; border-bottom:1px solid var(--bd); padding:0 12px; flex-shrink:0; }
.modal-tabs .tab { background:transparent; border:none; color:var(--t2); padding:6px 16px; font-size:12px; font-weight:600; border-bottom:2px solid transparent; }
.modal-tabs .tab.active { color:var(--am); border-bottom-color:var(--am); }
.modal-tabs .tab:disabled { opacity:0.35; cursor:default; }
.modal-tabs .tab:not(.active):not(:disabled):hover { color:var(--tx); }
.modal-body { flex:1; overflow:auto; min-height:340px; background:var(--bg); }
.modal-body iframe { display:block; width:100%; height:100%; min-height:60vh; border:0; background:#fff; }
.modal-body .body-text { padding:14px 20px; white-space:pre-wrap; word-wrap:break-word; font-size:13px; color:var(--tx); margin:0; font-family:'Consolas','Monaco',monospace; line-height:1.5; }
.modal-body .empty { padding:40px; text-align:center; color:var(--t3); }
.meta-pane { padding:18px 22px; font-size:13px; line-height:1.7; }
.meta-pane .row { display:grid; grid-template-columns:140px 1fr; gap:8px; padding:5px 0; border-bottom:1px solid var(--bd); }
.meta-pane .row b { color:var(--t2); font-weight:600; }

/* Verdict banner */
.verdict { padding:16px 22px; border-bottom:1px solid var(--bd); }
.verdict .title { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--t3); margin-bottom:6px; }
.verdict .body { font-size:14px; line-height:1.55; color:var(--tx); }
.verdict .body b { font-weight:700; }
.verdict.clean { background:rgba(16,185,129,0.08); border-left:4px solid var(--gn); }
.verdict.quarantined { background:rgba(245,158,11,0.08); border-left:4px solid var(--yw); }
.verdict.quarantined_strict { background:rgba(239,68,68,0.10); border-left:4px solid var(--rd); }
.verdict.ndr { background:rgba(107,114,128,0.08); border-left:4px solid var(--t2); }
.verdict.pending { background:rgba(59,130,246,0.08); border-left:4px solid var(--bl); }

.reasons { list-style:none; padding:0; margin:14px 0 0; }
.reasons li { padding:12px 14px; border-bottom:1px solid var(--bd); display:flex; flex-direction:column; gap:6px; background:var(--bg2); }
.reasons li:last-child { border-bottom:0; }
.reasons .r-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.reasons .r-layer { font-size:10px; padding:2px 7px; border-radius:3px; background:var(--bg3); color:var(--t2); font-weight:700; }
.reasons .r-layer.l1 { background:rgba(59,130,246,0.18); color:var(--bl); }
.reasons .r-layer.l2 { background:rgba(245,158,11,0.18); color:var(--yw); }
.reasons .r-layer.l3 { background:rgba(168,85,247,0.18); color:#a855f7; }
.reasons .r-layer.l4 { background:rgba(239,68,68,0.20); color:var(--rd); }
.reasons .r-title { font-weight:600; font-size:13px; color:var(--tx); flex:1; }
.reasons .r-weight { font-size:11px; color:var(--t3); background:var(--bg3); padding:1px 6px; border-radius:3px; }
.reasons .r-details { font-size:12px; color:var(--t2); font-family:'Consolas',monospace; word-break:break-all; padding-left:0; }
.reasons .r-explain { font-size:12px; color:var(--t2); line-height:1.5; }
.reasons .r-match { font-size:12px; color:var(--tx); margin-top:4px; }
.reasons .r-match-label { color:var(--t2); font-weight:600; }
.reasons .r-match-code { background:var(--code-bg); border:1px solid var(--bd); padding:2px 6px; border-radius:3px; color:var(--am); font-family:'Consolas',monospace; word-break:break-all; }
.rules-list { display:flex; flex-direction:column; gap:8px; }
.rule-card { background:var(--bg2); border:1px solid var(--bd); border-radius:4px; padding:12px; }
.rule-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
.rule-layer { font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; letter-spacing:0.5px; }
.rule-layer.l1 { background:#1b3a5a; color:#8cc4ff; }
.rule-layer.l2 { background:#3a2e1b; color:#ffc88a; }
.rule-layer.l3 { background:#3a1b3a; color:#ff8aff; }
.rule-layer.l4 { background:#5a1b1b; color:#ff8a8a; }
[data-theme="light"] .rule-layer.l1 { background:#dbeafe; color:#1d4ed8; }
[data-theme="light"] .rule-layer.l2 { background:#fef3c7; color:#92400e; }
[data-theme="light"] .rule-layer.l3 { background:#f3e8ff; color:#7c3aed; }
[data-theme="light"] .rule-layer.l4 { background:#fee2e2; color:#991b1b; }
.rule-title { font-weight:600; color:var(--tx); flex:1; }
.rule-action { font-size:11px; color:var(--am); font-family:'Consolas',monospace; }
.rule-desc { font-size:12px; color:var(--t2); line-height:1.5; }
.policy-box { background:var(--bg2); border:1px solid var(--bd); border-radius:4px; padding:14px; margin-bottom:16px; }
.policy-box h3 { margin:0 0 10px 0; font-size:13px; color:var(--tx); }
.policy-row { display:flex; justify-content:space-between; padding:4px 0; font-size:12px; color:var(--t2); border-bottom:1px solid var(--bd); }
.policy-row:last-child { border-bottom:none; }
.policy-row b { color:var(--tx); font-family:'Consolas',monospace; }
.reasons-section h4 { margin:20px 22px 8px; font-size:12px; text-transform:uppercase; letter-spacing:0.07em; color:var(--t3); }
.reasons-section { padding-bottom:14px; }

tr.clickable { cursor:pointer; transition:background 0.1s; }
tr.clickable:hover { background:var(--bg3); }
/* Action column (Legit / Marchează ca SPAM) must stay visible on every viewport */
th.actions-col, td.actions-col { display:table-cell !important; }
/* Email list tables (Toate/Email/Carantinate): keep all columns visible, scroll instead of hiding */
.list-table-full th, .list-table-full td { display:table-cell !important; }

/* MOBILE RESPONSIVE */
.hamburger { display:none; background:transparent; border:1px solid var(--bd); color:var(--am); width:36px; height:36px; border-radius:var(--r-sm); padding:0; font-size:18px; line-height:1; }
.spinner { border:2px solid var(--bd); border-top-color:var(--am); border-radius:50%; animation:mg-spin 0.7s linear infinite; }
@keyframes mg-spin { to { transform:rotate(360deg); } }
.sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:998; }
.sidebar-overlay.open { display:block; }
/* SweetAlert2 — theme integration */
.mg-swal-popup { border-radius: 12px !important; font-family: 'Inter', system-ui, sans-serif !important; border: 1px solid var(--bd) !important; }
.swal2-title { font-size: 16px !important; font-weight: 600 !important; }
.swal2-html-container { font-size: 13px !important; line-height: 1.55 !important; }
.swal2-confirm, .swal2-cancel { font-size: 13px !important; font-weight: 600 !important; border-radius: 6px !important; }
.swal2-timer-progress-bar { background: var(--am) !important; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position:fixed; top:0; left:-260px; width:240px; height:100vh; z-index:999;
    transition: left 0.25s ease-out;
    box-shadow: 4px 0 16px rgba(0,0,0,0.4);
    overflow-y: auto;
  }
  .sidebar.open { left:0; }
  .main-content { padding:14px 16px 16px; }
  .topbar { gap:10px; flex-wrap:wrap; padding:14px 16px 12px; }
  .table-wrap { max-height:calc(100vh - 200px); }
  .topbar h2 { font-size:17px; }
  .hamburger { display:inline-flex; align-items:center; justify-content:center; }
  .grid-cols-4 { grid-template-columns: repeat(2, 1fr); gap:10px; }
  .stat { padding:11px; }
  .stat .val { font-size:22px; }
  .stat .lbl { font-size:10px; }
  .card { padding:14px; border-radius:8px; }
  table { font-size:12px; }
  th, td { padding:7px 8px; }
  table th:nth-child(n+5), table td:nth-child(n+5) { display:none; }
  .login-box { max-width:100%; margin:30px 14px; padding:22px 18px; }
  .table-wrap { -webkit-overflow-scrolling: touch; }
  .btn { padding:9px 14px; font-size:13px; min-height:38px; }
  input, select, textarea { font-size:16px !important; }
  .modal-bg { padding:0; }
  .modal { max-height:100vh; max-width:100%; border-radius:0; height:100vh; }
  .meta-pane .row { grid-template-columns:1fr; gap:2px; padding:8px 0; }
}
@media (max-width: 480px) {
  .grid-cols-4 { grid-template-columns: 1fr; }
  .topbar { padding-bottom:10px; }
  .topbar .user { font-size:11px; }
  .sidebar-brand h1 { font-size:14px; }
  .mg-badge { width:32px; height:32px; font-size:11px; }
  .nav-item { padding:11px 14px; }
  table th, table td { padding:6px 7px; font-size:11px; }
  table th:nth-child(n+3), table td:nth-child(n+3) { display:none; }
}
@media (hover: none) {
  .nav-item, .btn, button { min-height:44px; }
}

/* === Email detail modal — redesign 2 coloane, flat, temă albă === */
.em2 { background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.12); border-radius:12px; width:1520px; max-width:97vw; height:88vh; max-height:88vh; display:flex; flex-direction:column; box-shadow:none; color:#2C2C2A; font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
.skl { background:linear-gradient(90deg, rgba(0,0,0,0.055) 25%, rgba(0,0,0,0.10) 37%, rgba(0,0,0,0.055) 63%); background-size:400% 100%; animation:skl 1.25s ease-in-out infinite; border-radius:6px; flex-shrink:0; }
/* Variantă adaptivă (dark/light) a .skl, pt. modale pe tema aplicației (var(--...)), nu tema fixă a EmailDetail. */
.skl2 { background:linear-gradient(90deg, var(--bg3) 25%, var(--bd) 37%, var(--bg3) 63%); background-size:400% 100%; animation:skl 1.25s ease-in-out infinite; border-radius:6px; flex-shrink:0; }
@keyframes skl { 0% { background-position:100% 0; } 100% { background-position:0 0; } }
.em2-body2 { flex:1; display:flex; min-height:0; }
.em2-side { width:228px; flex-shrink:0; background:#FAFAF7; border-right:0.5px solid rgba(0,0,0,0.10); padding:14px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
.em2-main2 { flex:1; min-width:0; display:flex; flex-direction:column; }
.em2 .em2-content { flex:1; overflow:auto; min-height:0; background:#FFFFFF; }
.em2-tab2 { background:transparent; border:none; color:#5F5E5A; padding:11px 14px; font-size:13px; font-weight:400; border-bottom:2px solid transparent; cursor:pointer; }
.em2-tab2.active { color:#2C2C2A; border-bottom-color:#2C2C2A; font-weight:500; }
.em2-tab2:disabled { opacity:0.4; cursor:default; }
.em2-tab2:not(.active):not(:disabled):hover { color:#2C2C2A; }
.em2 .body-text { padding:14px 18px; white-space:pre-wrap; word-wrap:break-word; font-size:13px; color:#2C2C2A; margin:0; font-family:'Consolas','Monaco',monospace; line-height:1.7; }
.em2 .empty { padding:40px; text-align:center; color:#888780; }
.em2 .meta-pane { color:#2C2C2A; }
.em2 .meta-pane .row { border-bottom:0.5px solid rgba(0,0,0,0.10); }
.em2 .meta-pane .row b { color:#5F5E5A; font-weight:500; }
.em2 .meta-pane .badge { background:#F2F2EF; color:#5F5E5A; }
@media (max-width:640px) {
  .em2 { width:100%; max-width:100%; height:100vh; max-height:100vh; border-radius:0; }
  .em2-body2 { flex-direction:column; }
  .em2-side { width:auto; border-right:none; border-bottom:0.5px solid rgba(0,0,0,0.10); max-height:44vh; }
